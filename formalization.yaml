automation:
  methods:
    - method: "agent"
      models: ["claude-opus-5-5"]
      framework: "Claude Code"
      tool_setup: >-
        An autonomous Claude Code subagent was given the problem statement, a sketch of
        Horton's construction and the EmptyHexagonLean definitions, and iterated on the Lean
        source with `lake env lean` (local Lean/Mathlib checks) until the file compiled with no
        sorry. Orchestration (task decomposition, statement comparison against formal-conjectures
        PR #6775, packaging) was done by claude-fable-5-1.
      cost:
        wall_time: "about 20 minutes for the proof"
        spend_usd: "subscription-based usage"
        hardware: "API-only, local Lean checks on an ARM64 workstation"
      prompting_notes: "Statements and definitions were fixed first; the agent was asked for a sorry-free, native_decide-free proof using only standard axioms."
  spend_usd: "subscription-based usage"
  notes: >-
    Mike Helsel directed the work, chose the problems and is responsible for the repository.
    All proofs were machine-generated and checked by the Lean kernel; the Comparator entry was
    additionally replayed by lean4lean, nanoda, con-leche and con-ron (`lake comparator --paranoid`).

fidelity:
  divergences: >-
    (1) Emptiness: an empty convex k-gon is required to have no other point of the set in the
    interior of its convex hull (Mathlib `interior (convexHull ℝ T)`). This is the weakest
    emptiness condition, so the non-existence statements proved are the strongest form; for
    point sets in general position it is equivalent to the closed-hull notion, which is also
    proved (Horton.not_hasEmptyConvexKGon'). (2) General position means no three distinct
    points are collinear (Mathlib `Collinear ℝ {p, q, r}`), the standard hypothesis of the
    problem. (3) Convex position means no point lies in the convex hull of the remaining
    points. (4) The plane is modelled both as ℝ × ℝ (erdos_216_ge_seven) and as
    EuclideanSpace ℝ (Fin 2) (horton_euclidean, and the formal-conjectures statements);
    the definitions are stated for an arbitrary real vector space. (5) The formal-conjectures
    definitions are copied with primed names; NonTrilinear is specialised from an arbitrary
    Euclidean affine space to ℝ², and `answer(False)` is read as `False`. (6) For exactly N
    points the construction uses a prefix of a Horton set of size 2^N with explicit integer
    coordinates.

review:
  status: "agent-reviewed"
  reviewers: ["claude-fable-5-1 (orchestrating agent)", "second Claude Code agent (statement comparison)"]
  notes: >-
    Kernel-checked (Lean kernel; Comparator also replayed with lean4lean, nanoda, con-leche,
    con-ron); axioms audited with #print axioms (only propext, Classical.choice, Quot.sound;
    no native_decide); the definitions and statements were compared against formal-conjectures
    PR #6775 by a second agent. No line-by-line human review of the proof has been done yet.

alignment:
  namespace: "Horton"
  statements:
    - source: "Horton 1983, main theorem (Euclidean plane): for every N, N points in general position with no empty convex 7-gon (hence none for any k ≥ 7)"
      lean: "Horton.horton_euclidean"
      module: "Challenge.lean / Solution.lean"
      status: "proved"
    - source: "Erdős Problem 216: g(k) does not exist for k ≥ 7"
      lean: "Horton.erdos_216_ge_seven"
      module: "Challenge.lean / Solution.lean"
      status: "proved"
    - source: "formal-conjectures PR #6775, Erdos216.erdos_216.variants.horton"
      lean: "Horton.cardSet'_eq_empty"
      module: "Challenge.lean / Solution.lean"
      status: "proved"
    - source: "formal-conjectures PR #6775, Erdos216.erdos_216 (answer False)"
      lean: "Horton.erdos_216'"
      module: "Challenge.lean / Solution.lean"
      status: "proved"
    - source: "General position (no three collinear)"
      lean: "Horton.InGeneralPosition"
      module: "Challenge.lean"
      status: "definition"
    - source: "Convex position (convex independence)"
      lean: "Horton.ConvexPosition"
      module: "Challenge.lean"
      status: "definition"
    - source: "Empty convex k-gon"
      lean: "Horton.HasEmptyConvexKGon"
      module: "Challenge.lean"
      status: "definition"
      note: "Interior-of-hull emptiness; closed-hull variant HasEmptyConvexKGon' handled in Solution.lean."
    - source: "Horton's construction and the no-open-4-cup/4-cap lemma"
      lean: "Horton.hortonSetInt, Horton.cup_cap, Horton.good_card, Horton.hortonSet_empty_le_six"
      module: "Solution.lean"
      status: "proved"

acknowledgements: "Built on Mathlib. Definitions adapted from EmptyHexagonLean and formal-conjectures."
